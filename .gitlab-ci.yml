stages:
  - structure
  - build_backend
  - publish_npm_package
  - build_frontend
  - deploy

structure:
  stage: structure
  script:
    - '[ -d backend ] || exit 1'
    - '[ -d frontend ] || exit 1'
  only:
    - dev
    #- spike/103-deployment-AWS

services:
  - name: docker:dind
    alias: dockerhost

variables:
  DOCKER_HOST: tcp://dockerhost:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  TESTCONTAINERS_HOST_OVERRIDE: dockerhost
  NPM_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
  NPM_SCOPE: "@dti-isin"
  AZURE_DOMAIN_NAME: "@testforprojectsupsi.onmicrosoft.com"
  GCP_PROJECT_ID: "${GCP_PROJECT_ID}"
  GCP_REGION: "${GCP_REGION}"
  ARTIFACT_REGISTRY_LOCATION: "${ARTIFACT_REGISTRY_LOCATION}"
  ARTIFACT_REGISTRY_REPO: "${ARTIFACT_REGISTRY_REPO}"
  GCP_SERVICE_KEY: "${GCP_SERVICE_KEY}"

build_backend:
  stage: build_backend
  image:
    name: quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21
    entrypoint: [ "" ]
    docker:
      user: root
  script:
    - cd backend
    - chmod +x ./mvnw
    - ./mvnw clean verify -Pnative -Dquarkus.native.additional-build-args="--initialize-at-run-time=com.microsoft.aad.msal4jextensions.persistence.linux.ISecurityLibrary"
  artifacts:
    paths:
      - backend/target/*-runner
      - backend/target/backend-api-client
  only:
    - dev
    #- spike/103-deployment-AWS

publish_npm_package:
  stage: publish_npm_package
  image: node:22.14-alpine
  before_script:
    - echo "//gitlab-edu.supsi.ch/api/v4/projects/1051/packages/npm/:_authToken=${CI_JOB_TOKEN}" > backend/target/backend-api-client/.npmrc
    - echo "${NPM_SCOPE}:registry=${NPM_REGISTRY_URL}" >> .npmrc
  script:
    - cd backend/target/backend-api-client
    - npm install
    - npm publish --registry=${NPM_REGISTRY_URL}
  dependencies:
    - build_backend
  only:
    - dev
    #- spike/103-deployment-AWS

build_frontend:
  stage: build_frontend
  image: node:22.14-alpine
  before_script:
    - echo "//${CI_SERVER_HOST}/api/v4/projects/1051/packages/npm/:_authToken=${CI_JOB_TOKEN}" > frontend/.npmrc
    - echo "${NPM_SCOPE}:registry=${NPM_REGISTRY_URL}" >> frontend/.npmrc
  script:
    - cd frontend
    - npm install
    - npm run build
  dependencies:
    - publish_npm_package
  artifacts:
    paths:
      - frontend/dist/
  only:
    - dev
    - spike/103-deployment-AWS

deploy_backend:
  stage: deploy
  image:
    name: google/cloud-sdk:slim
    entrypoint: [""]
  script:
    # autentico il service account
    - echo "$GCP_SERVICE_KEY" > gcp_key.json
    - gcloud auth activate-service-account --key-file=gcp_key.json
    - gcloud config set project $GCP_PROJECT_ID
    - gcloud config set run/region $GCP_REGION

    - gcloud auth configure-docker ${ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev --quiet
    - cat gcp_key.json | docker login -u _json_key --password-stdin ${ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev

    # build & push dell'immagine backend
    - cd backend
    - docker build -t ${ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/backend:$CI_COMMIT_SHORT_SHA .
    - docker push ${ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/backend:$CI_COMMIT_SHORT_SHA

    # deploy su Cloud Run (servizio pubblico)
    - gcloud run deploy backend-service --image ${ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/backend:$CI_COMMIT_SHORT_SHA --platform managed --allow-unauthenticated --set-env-vars QUARKUS_PROFILE=prod
  only:
    - dev
    - spike/103-deployment-AWS

deploy_frontend:
  stage: deploy
  image:
    name: google/cloud-sdk:slim
    entrypoint: [""]
  variables:
    - VITE_AZURE_CLIENT_ID: "${AZURE_CLIENT_ID}"
    - VITE_AZURE_TENANT_ID: "${AZURE_TENANT_ID}"
    - VITE_REDIRECT_URI: "/"
    - VITE_LOGOUT_REDIRECT_URI: "/"
    - VITE_BACKEND_CLIENT_ID: "527ea26f-be1b-428f-8d09-2849729fe4fe"
    - VITE_BACKEND_URL: ""
  before_script:
    - echo "//${CI_SERVER_HOST}/api/v4/projects/1051/packages/npm/:_authToken=${CI_JOB_TOKEN}" > frontend/.npmrc
    - echo "${NPM_SCOPE}:registry=${NPM_REGISTRY_URL}" >> frontend/.npmrc
  script:
    - echo "$GCP_SERVICE_KEY" > gcp_key.json
    - gcloud auth activate-service-account --key-file=gcp_key.json
    - gcloud config set project $GCP_PROJECT_ID
    - gcloud config set run/region $GCP_REGION


    - gcloud auth configure-docker ${ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev --quiet
    - cat gcp_key.json | docker login -u _json_key --password-stdin ${ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev

    # build & push dell'immagine frontend
    - cd frontend
    - docker build -t ${ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/frontend:$CI_COMMIT_SHORT_SHA .
    - docker push ${ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/frontend:$CI_COMMIT_SHORT_SHA

    # deploy su Cloud Run (servizio pubblico)
    - gcloud run deploy frontend-service --image ${ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/frontend:$CI_COMMIT_SHORT_SHA --platform managed --allow-unauthenticated
  only:
    - dev
    - spike/103-deployment-AWS
