stages:
  - structure
  - build_backend
  - build_frontend
  - test
  #- deploy

structure:
  stage: structure
  script:
    - '[ -d backend ] || exit 1'
    - '[ -d frontend ] || exit 1'
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

services:
  - name: docker:dind
    alias: dockerhost

variables:
  DOCKER_HOST: tcp://dockerhost:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

build_backend:
  stage: build_backend
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd backend
    - mvn clean package -DskipTests=false
  artifacts:
    paths:
      - backend/target/*.jar
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

build_frontend:
  stage: build_frontend
  image: node:22.14-alpine
  script:
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

