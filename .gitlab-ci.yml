stages:
  - structure
  - build_backend
  - build_frontend
  #- deploy

structure:
  stage: structure
  script:
    - '[ -d backend ] || exit 1'
    - '[ -d frontend ] || exit 1'
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "spike/68-handle-openAPI-package-registry"


services:
  - name: docker:dind
    alias: dockerhost

variables:
  DOCKER_HOST: tcp://dockerhost:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  TESTCONTAINERS_HOST_OVERRIDE: dockerhost

build_backend:
  stage: build_backend
  image:
    name: quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21
    entrypoint: [""]
    docker:
      user: root
  script:
    - cd backend
    - chmod +x ./mvnw
    - ./mvnw clean verify -Pnative
  artifacts:
    paths:
      - backend/target/*-runner
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "spike/68-handle-openAPI-package-registry"


build_frontend:
  stage: build_frontend
  image: node:22.14-alpine
  script:
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "spike/68-handle-openAPI-package-registry"

