stages:
  - structure
  - build_backend
  - build_frontend
  #- deploy

structure:
  stage: structure
  script:
    - '[ -d backend ] || exit 1'
    - '[ -d frontend ] || exit 1'
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "spike/51-native-image-quarkus"

services:
  - name: docker:dind
    alias: dockerhost

variables:
  DOCKER_HOST: tcp://dockerhost:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  TESTCONTAINERS_HOST_OVERRIDE: dockerhost

build_backend:
  stage: build_backend
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd backend
    - mvn clean verify -Pnative -Dquarkus.native.container-build=true -Dquarkus.oidc.enabled=false  #per test con oidc sistemare e aggiungere variabili ambiente per tenantID e clientID
    #- ./mvnw clean verify -Pnative -Dquarkus.native.container-build=true -Dquarkus.oidc.enabled=false
  artifacts:
    paths:
      - backend/target/*-runner
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "spike/51-native-image-quarkus"


build_frontend:
  stage: build_frontend
  image: node:22.14-alpine
  script:
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "spike/51-native-image-quarkus"

