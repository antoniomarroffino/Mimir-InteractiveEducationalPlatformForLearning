stages:
  - structure
  - build_backend
  - publish_npm_package
  - build_frontend
  - deploy

structure:
  stage: structure
  script:
    - '[ -d backend ] || exit 1'
    - '[ -d frontend ] || exit 1'
  only:
    - dev
    - spike/103-deployment-AWS

services:
  - name: docker:dind
    alias: dockerhost

variables:
  DOCKER_HOST: tcp://dockerhost:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  TESTCONTAINERS_HOST_OVERRIDE: dockerhost
  NPM_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
  NPM_SCOPE: "@dti-isin"
  AZURE_DOMAIN_NAME: "@testforprojectsupsi.onmicrosoft.com"

build_backend:
  stage: build_backend
  image:
    name: quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21
    entrypoint: [ "" ]
    docker:
      user: root
  script:
    - cd backend
    - chmod +x ./mvnw
    - ./mvnw clean verify -Pnative -Dquarkus.native.additional-build-args="--initialize-at-run-time=com.microsoft.aad.msal4jextensions.persistence.linux.ISecurityLibrary"
  artifacts:
    paths:
      - backend/target/*-runner
      - backend/target/backend-api-client
  only:
    - dev
    - spike/103-deployment-AWS

publish_npm_package:
  stage: publish_npm_package
  image: node:22.14-alpine
  before_script:
    - echo "//gitlab-edu.supsi.ch/api/v4/projects/1051/packages/npm/:_authToken=${CI_JOB_TOKEN}" > backend/target/backend-api-client/.npmrc
    - echo "${NPM_SCOPE}:registry=${NPM_REGISTRY_URL}" >> .npmrc
  script:
    - cd backend/target/backend-api-client
    - npm install
    - npm publish --registry=${NPM_REGISTRY_URL}
  dependencies:
    - build_backend
  only:
    - dev
    - spike/103-deployment-AWS

build_frontend:
  stage: build_frontend
  image: node:22.14-alpine
  before_script:
    - echo "//${CI_SERVER_HOST}/api/v4/projects/1051/packages/npm/:_authToken=${CI_JOB_TOKEN}" > frontend/.npmrc
    - echo "${NPM_SCOPE}:registry=${NPM_REGISTRY_URL}" >> frontend/.npmrc
  script:
    - cd frontend
    - npm install
    - npm run build
  dependencies:
    - publish_npm_package
  artifacts:
    paths:
      - frontend/dist/
  only:
    - dev
    - spike/103-deployment-AWS

deploy:
  stage: deploy
  image: amazon/aws-cli
  before_script:
    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set default.region $AWS_DEFAULT_REGION

  script:
    # FRONTEND → S3 + invalidate CloudFront
    - cd frontend
    - npm ci && npm run build
    - aws s3 sync dist/ s3://$FRONTEND_S3_BUCKET/ --delete
    - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
    - cd ..

    # BACKEND → Docker push su ECR
    - aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
    - docker build -t $ECR_REGISTRY:latest backend
    - docker push $ECR_REGISTRY:latest

    # APP RUNNER → deploy nuovo container
    - aws apprunner update-service \
      --service-arn $APP_RUNNER_SERVICE_ARN \
      --source-configuration ImageRepository='{ImageIdentifier="$ECR_REGISTRY:latest",ImageRepositoryType="ECR",ImageConfiguration={Port="8080"}}'
  only:
    #- main
    - spike/103-deployment-AWS


