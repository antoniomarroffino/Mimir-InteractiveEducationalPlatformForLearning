version: '3.8'
services:
  backend:
    build: ./backend
    env_file:
      - backend/.env
    ports:
      - "8080:8080"
    networks:
      - app-network

  nginx:
    build: ./frontend
    image: nginx:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
     - app-network

networks:
  app-network:
    driver: bridge