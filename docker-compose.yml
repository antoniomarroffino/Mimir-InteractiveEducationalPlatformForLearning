version: '3.8'
services:
  backend:
    build:
      context: ./backend
    image: backend:latest
    env_file:
      - backend/.env
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    image: frontend:latest

  nginx:
    build:
      context: ./nginx
    image: nginx:latest
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend