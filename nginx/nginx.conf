events {}
http {
  include mime.types;

  upstream backend {
    server backend:8080;
  }
  upstream frontend {
    server frontend:3000;
  }

  server {
    listen 80;
    server_name localhost;

    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}