quarkus.mongodb.connection-string=mongodb://${QUARKUS_MONGODB_HOST:localhost}:${QUARKUS_MONGODB_PORT:27017}
quarkus.mongodb.database=myAppTest
quarkus.oidc.enabled=false
quarkus.oidc.auth-server-url=ignored
app.azure.tenant-id=${AZURE_TENANT_ID}
